<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD App</title>
</head>
<body>
  <h1>CRUD App</h1>
  <div id="users"></div>
  <script>
    async function fetchUsers() {
      const response = await fetch('http://backend:3000/api/users');
      const users = await response.json();
      document.getElementById('users').innerHTML = users.map(user => `
        <div>
          <h2>${user.name}</h2>
          <p>${user.email}</p>
        </div>
      `).join('');
    }

    fetchUsers();
  </script>
</body>
</html>
